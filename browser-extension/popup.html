<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PM Stack 评论助手</title>
<style>body{font:14px system-ui;width:320px;padding:16px;color:#25334b}h2{margin:0 0 12px}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border:1px solid #cad2df;border-radius:7px}button{background:#4b60ff;color:white;cursor:pointer}p{line-height:1.6}#status{white-space:pre-wrap}</style>
<h2>PM Stack 评论助手</h2><p>使用当前浏览器配置的 Amazon 登录。请保持 PM Stack 的扩展连接开启。</p>
<label for="token">PM Stack 连接码</label><input id="token" type="password" autocomplete="off" placeholder="粘贴 PM Stack 复制的连接码">
<button id="connect">保存并连接</button><button id="check">立即检查任务 / 登录后继续</button><button id="disconnect">断开此扩展</button>
<p id="status" role="status">等待连接</p><script src="popup.js"></script></html>
